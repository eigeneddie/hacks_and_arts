<!doctype html>
<!-- Tells the browser this is an HTML5 document -->
<html lang="en">
<!-- lang="en" helps screen readers and search engines know the language -->

<head>
  <!-- Everything in <head> is metadata — not visible on the page -->

  <meta charset="utf-8" />
  <!-- utf-8 lets you use special characters like &, é, → without breaking -->

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Makes the page scale correctly on mobile. Without this, phones zoom out and show a tiny desktop view -->

  <title>eigeneddie::blog</title>
  <!-- Text shown in the browser tab -->

  <meta name="description" content="Independent R&D notes by Edgar Sutawika: teardowns, experiments and builds on a budget." />
  <!-- The summary Google and link previews show under the page title -->

  <link rel="stylesheet" href="style.css" />
  <!-- Loads the CSS file that controls all the visual styling -->
</head>

<body>
  <!-- Everything in <body> is what the user actually sees -->

  <!-- ── HEADER ───────────────────────────────────────────────────── -->
  <!-- This header is copied into about.html too. If you change it here, change it there. -->
  <header>
    <a class="logo" href="index.html">eigeneddie<span>::</span>blog</a>
    <!-- The logo is a link back to the home page -->
    <!-- The <span> wraps just the :: so CSS can color it teal -->

    <nav>
      <a href="index.html" class="active">home</a>
      <a href="about.html">about</a>
      <!-- class="active" marks the page you're currently on (styled brighter in CSS).
           On about.html, the class moves to the "about" link instead. -->
    </nav>
  </header>

  <!-- ── BANNER ───────────────────────────────────────────────────── -->
  <img class="banner" src="images/banner.jpg"
       alt="A half-built rig on a workshop floor, surrounded by wires, a toolbox and a multimeter" />
  <!-- <img> shows an image. It has no closing tag.
       src = path to the image file, relative to this HTML file
       alt = text description: read aloud by screen readers, and shown if the image fails to load
       The cropping and sizing happen in style.css under .banner -->

  <!-- ── HERO ─────────────────────────────────────────────────────── -->
  <section class="hero">
    <h1>Building projects with minimal resources.</h1>
    <!-- h1 = the most important heading on the page. Only use one per page -->

    <p>Independent R&amp;D: teardowns, experiments and builds on a budget, documented as I go.</p>
    <!-- &amp; is the HTML way to write & safely -->
  </section>

  <!-- ── POSTS ────────────────────────────────────────────────────── -->
  <section>
    <p class="section-label">Posts</p>

    <!-- The posts below are filled in automatically from Substack by
         scripts/update_posts.py. Don't edit between the START and END
         markers: your changes get overwritten on the next update.
         Each post is one <a class="post"> block, newest at the top. -->
    <!-- POSTS:START -->
    <a class="post" href="posts/thinking-out-loud-just-for-the-lols.html">
      <span class="post-date">2026-11-14</span>
      <span class="post-title">Thinking out loud just for the LOLs</span>
      <span class="post-summary">A note on what I care about on my spare time</span>
    </a>
    <!-- POSTS:END -->
  </section>

  <!-- ── FOOTER ────────────────────────────────────────────────────── -->
  <!-- Also copied into about.html -->
  <footer>
    <span>edgar sutawika</span>
  </footer>

</body>
</html>
